[mod-name]
k2-loaders=K2 Loaders (Standalone)

[mod-description]
k2-loaders=Standalone version of the Krastorio 2 1x1 loaders. Loaders are generated for every transport belt tier in the game, including Pyanodons, Bob's, Angel's and Space Age tiers. Prototypes and graphics are taken from Krastorio 2 by Linver, Krastor and raiguard (LGPL-3.0); see CREDITS.md. This mod is incompatible with Krastorio 2.

[mod-setting-name]
k2-loaders-all-belts=Generate loaders for all belt tiers
k2-loaders-need-power=Loaders require power

[mod-setting-description]
k2-loaders-all-belts=When enabled, a loader is generated for every transport belt added by any mod. When disabled, only the base game belt tiers (yellow, red, blue and turbo) receive loaders.
k2-loaders-need-power=When enabled, loaders need electricity to move items. When disabled, loaders work without power and consume no energy at all.

