[mod-name]
k2-loaders=K2 装卸机（独立版）

[mod-description]
k2-loaders=从 Krastorio 2 提取的 1x1 装卸机。会自动为游戏中的每一档传送带（包括 Pyanodons、Bob's、Angel's 和太空时代）生成对应的装卸机。原型与美术资源来自 Krastorio 2（Linver、Krastor、raiguard，LGPL-3.0），详见 CREDITS.md。本 mod 与 Krastorio 2 互斥，无法同时启用。

[setting-name]
k2-loaders-all-belts=为所有传送带等级生成装卸机
k2-loaders-need-power=装卸机需要电力

[setting-description]
k2-loaders-all-belts=开启后，会为所有 mod 添加的传送带生成装卸机；关闭后只为原版传送带等级（黄带、红带、蓝带和涡轮带）生成。
k2-loaders-need-power=开启时装卸机需要供电才能搬运物品；关闭后装卸机无需电力，也不会产生耗电与待机功耗。

